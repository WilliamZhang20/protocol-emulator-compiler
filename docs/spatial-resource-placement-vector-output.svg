<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Placed spatial tile state centroids in the vector-output candidate</title>
  <desc id="desc">OpenDB post-global-route placement centers for logic cells, timers, counters, CRCs, shifters, and edge cells. A measured selector path spans from logic cell 7's line 63 register to shifter 1's skip-left register.</desc>
  <rect width="1100" height="620" fill="#fff"/>
  <text x="550" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Placed tile state centroids · vector-output candidate</text>
  <text x="550" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">OpenDB post-GRT placement · points are centroids of named state flops, not hard tile boundaries</text>
  <rect x="80" y="75" width="950" height="392" fill="#fafafa" stroke="#444" stroke-width="1.5"/>
  <g stroke-width="2.5">
    <path d="M96 75V85 M98 75V85 M100 75V85 M102 75V85 M104 75V85 M106 75V85 M109 75V85 M111 75V85" stroke="#777"/>
    <path d="M113 75V85 M115 75V85 M117 75V85 M119 75V85 M121 75V85 M123 75V85 M126 75V85 M128 75V85" stroke="#2ca02c"/>
    <path d="M147 75V85 M149 75V85 M151 75V85 M153 75V85 M155 75V85 M157 75V85 M160 75V85 M162 75V85" stroke="#1f77b4"/>
  </g>
  <g font-family="sans-serif" font-size="10" fill="#333">
    <text x="171" y="83">8 uio_oe, 8 uio_out, and 8 uio_in pad terminals share this top edge, clustered near x=30–149 µm.</text>
  </g>
  <g stroke="#ddd" stroke-width="1" font-family="sans-serif" font-size="11" fill="#555">
    <path d="M80 467H1030 M80 357H1030 M80 247H1030 M80 137H1030"/>
    <path d="M80 75V467 M355 75V467 M630 75V467 M905 75V467"/>
    <text x="70" y="471" text-anchor="end">0</text><text x="70" y="361" text-anchor="end">200</text><text x="70" y="251" text-anchor="end">400</text><text x="70" y="141" text-anchor="end">600</text>
    <text x="80" y="485" text-anchor="middle">0</text><text x="355" y="485" text-anchor="middle">500</text><text x="630" y="485" text-anchor="middle">1000</text><text x="905" y="485" text-anchor="middle">1500</text>
  </g>
  <text x="555" y="507" text-anchor="middle" font-family="sans-serif" font-size="13">x position (µm)</text>
  <text x="25" y="270" text-anchor="middle" transform="rotate(-90 25 270)" font-family="sans-serif" font-size="13">y position (µm)</text>

  <!-- Signal line 63 driver-to-consumer placement path, exact register locations. -->
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d62728"/></marker></defs>
  <path d="M920 144 L174 128" fill="none" stroke="#d62728" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
  <text x="545" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b51f24" font-weight="bold">line 63 → shifter1.skip_left[6] · 1,385.76 µm placed Manhattan distance</text>

  <!-- Logic cells: centers from named configuration/state flops. -->
  <g fill="#1f77b4" stroke="#0b3c68" stroke-width="1.2" font-family="sans-serif" font-size="11" text-anchor="middle">
    <circle cx="863.2" cy="308" r="7"/><text x="863.2" y="300">L0</text>
    <circle cx="879.6" cy="112" r="7"/><text x="879.6" y="104">L1</text>
    <circle cx="914.7" cy="174" r="7"/><text x="914.7" y="166">L2</text>
    <circle cx="896.9" cy="136" r="7"/><text x="896.9" y="128">L3</text>
    <circle cx="907.3" cy="244" r="7"/><text x="907.3" y="236">L4</text>
    <circle cx="754.0" cy="107" r="7"/><text x="754.0" y="99">L5</text>
    <circle cx="853.1" cy="169" r="7"/><text x="853.1" y="161">L6</text>
    <circle cx="906.8" cy="168" r="7"/><text x="906.8" y="160">L7</text>
  </g>
  <!-- Timers. -->
  <g fill="#ff7f0e" stroke="#8a4300" stroke-width="1.2" font-family="sans-serif" font-size="11" text-anchor="middle">
    <rect x="853" y="348" width="12" height="12"/><text x="859" y="345">T0</text>
    <rect x="743" y="359" width="12" height="12"/><text x="749" y="356">T1</text>
    <rect x="810" y="357" width="12" height="12"/><text x="816" y="354">T2</text>
    <rect x="930" y="299" width="12" height="12"/><text x="936" y="296">T3</text>
  </g>
  <!-- Shifters. -->
  <g fill="#2ca02c" stroke="#155d17" stroke-width="1.2" font-family="sans-serif" font-size="11" text-anchor="middle">
    <path d="M654.8 260 l8 8 -8 8 -8-8z"/><text x="654.8" y="254">S0</text>
    <path d="M352.6 148 l8 8 -8 8 -8-8z"/><text x="352.6" y="142">S1</text>
  </g>
  <!-- Counters and CRCs. -->
  <g fill="#9467bd" stroke="#4c3470" stroke-width="1.2" font-family="sans-serif" font-size="11" text-anchor="middle">
    <path d="M592.2 211 l8 14 h-16z"/><text x="592.2" y="207">C0</text>
    <path d="M547.5 139 l8 14 h-16z"/><text x="547.5" y="135">C1</text>
  </g>
  <g fill="#8c564b" stroke="#50312b" stroke-width="1.2" font-family="sans-serif" font-size="11" text-anchor="middle">
    <rect x="443" y="183" width="13" height="13" rx="3"/><text x="449.5" y="179">CRC0</text>
    <rect x="286" y="184" width="13" height="13" rx="3"/><text x="292.5" y="180">CRC1</text>
  </g>
  <g fill="#7f7f7f" stroke="#404040" stroke-width="1" font-family="sans-serif" font-size="10" text-anchor="middle">
    <circle cx="486.2" cy="218" r="5"/><text x="486.2" y="211">E0</text><circle cx="502.4" cy="190" r="5"/><text x="502.4" y="183">E1</text>
    <circle cx="532.2" cy="223" r="5"/><text x="532.2" y="216">E2</text><circle cx="560.4" cy="227" r="5"/><text x="560.4" y="220">E3</text>
    <circle cx="518.4" cy="218" r="5"/><text x="518.4" y="211">E4</text><circle cx="536.5" cy="200" r="5"/><text x="536.5" y="193">E5</text>
    <circle cx="500.9" cy="278" r="5"/><text x="500.9" y="271">E6</text><circle cx="473.2" cy="234" r="5"/><text x="473.2" y="227">E7</text>
  </g>

  <g font-family="sans-serif" font-size="12">
    <circle cx="100" cy="535" r="6" fill="#1f77b4"/><text x="112" y="539">Logic cells</text>
    <rect x="218" y="529" width="12" height="12" fill="#ff7f0e"/><text x="237" y="539">Timers</text>
    <path d="M322 529l7 7 -7 7 -7-7z" fill="#2ca02c"/><text x="337" y="539">Shifters</text>
    <path d="M425 529l7 12h-14z" fill="#9467bd"/><text x="440" y="539">Counters</text>
    <rect x="526" y="529" width="13" height="13" rx="3" fill="#8c564b"/><text x="545" y="539">CRCs</text>
    <circle cx="613" cy="535" r="5" fill="#7f7f7f"/><text x="625" y="539">Edge cells</text>
    <path d="M727 535h32" stroke="#d62728" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="768" y="539">Measured selector path</text>
  </g>
  <text x="80" y="583" font-family="sans-serif" font-size="11" fill="#555">Source: post-GRT OpenDB centroids of named state flops, vector-output candidate, pinned baseline RTL. Pins and byte tiles are omitted.</text>
</svg>
