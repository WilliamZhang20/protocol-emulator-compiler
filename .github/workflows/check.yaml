name: compiler
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-10-26'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The legacy compiler emits actor ABI 2 for some examples. The default
      # pinned hardware predates that ABI; use the matching experimental RTL
      # for this legacy-backend regression, not the new SRAM-fabric top.
      - name: Checkout legacy actor ABI 2 RTL
        uses: actions/checkout@v4
        with:
          repository: WilliamZhang20/protocol-emulator
          ref: c05303461c8a7d197702c53310dda13065539c1b
          path: legacy-actor-rtl
      - name: Run legacy backend examples on compatible RTL
        env:
          SPATIAL_RTL_DIR: ${{ github.workspace }}/legacy-actor-rtl
        run: |
          cargo build --locked
          for example in examples/*.spt; do target/debug/spatial run --test "$example"; done
          python3 tests/ethernet_cases.py target/debug/spatial
      - name: A new project works from an installed binary
        env:
          SPATIAL_RTL_DIR: ${{ github.workspace }}/legacy-actor-rtl
        run: |
          cargo install --locked --path . --root /tmp/spatial
          cd /tmp && /tmp/spatial/bin/spatial new hello && cd hello && /tmp/spatial/bin/spatial run --test
  circt-fabric:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-10-26'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install CIRCT runtime and verified release
        run: |
          sudo apt-get update
          sudo apt-get install -y libz3-4
          curl -fsSL https://github.com/llvm/circt/releases/download/firtool-1.164.0/circt-full-shared-linux-x64.tar.gz -o /tmp/circt.tar.gz
          echo '8bc16060f8a2d6af249b37b3f68705a4acc5a448f5776a28b6d97f13577e074e  /tmp/circt.tar.gz' | sha256sum -c -
          mkdir -p /tmp/circt
          tar -xzf /tmp/circt.tar.gz -C /tmp/circt
          echo 'LD_LIBRARY_PATH=/tmp/circt/firtool-1.164.0/lib' >> "$GITHUB_ENV"
      - name: Checkout matching experimental RTL
        uses: actions/checkout@v4
        with:
          repository: WilliamZhang20/protocol-emulator
          ref: 8b2a9c3d51a807751681d44c75a20291fa5e6d6d
          path: fabric-rtl
      - name: Build frontend, dialect and RTL tests
        run: |
          cargo build --locked --bin spatial
          CIRCT_PREFIX=/tmp/circt/firtool-1.164.0 OUT=/tmp/spatial-circt-map circt_lab/build.sh
          make -C fabric-rtl tile-fabric-v2-experiment grid-fabric-experiment ROUTING_YOSYS=yosys
      - name: Check source images against same-fabric RTL
        env:
          CIRCT_MAP: /tmp/spatial-circt-map
          CIRCT_OPT: /tmp/circt/firtool-1.164.0/bin/circt-opt
          SPATIAL_DIALECT: /tmp/libSpatialDialect.so
          RTL_ROOT: ${{ github.workspace }}/fabric-rtl
          V2_UNIFIED_IMAGE_TB: ${{ github.workspace }}/fabric-rtl/build/verilator/fabric_v2_unified/Vunified_tb
          V2_UNIFIED_SPI_FIXTURE: ${{ github.workspace }}/fabric-rtl/test/data/v2-unified-spi.mem
          V2_UNIFIED_UART_FIXTURE: ${{ github.workspace }}/fabric-rtl/test/data/v2-unified-uart.mem
          GRID_IMAGE_TB: ${{ github.workspace }}/fabric-rtl/build/verilator/grid_stream_fabric/Vgrid_stream_fabric_tb
          GRID_SPI_FIXTURE: ${{ github.workspace }}/fabric-rtl/test/data/grid-spi.mem
          GRID_UART_FIXTURE: ${{ github.workspace }}/fabric-rtl/test/data/grid-uart.mem
          GRID_CRC_PROFILE_FIXTURE: ${{ github.workspace }}/fabric-rtl/test/data/grid-crc-profiles.json
          GRID_JTAG_FIXTURE: ${{ github.workspace }}/fabric-rtl/test/data/grid-jtag.mem
        run: circt_lab/test.sh
